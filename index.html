<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Dawn Dental Clinic - Premium dental care with advanced technology. Comprehensive treatments from routine cleanings to complex restorations.">
  <title>Dawn Dental Clinic | Premium Dental Care</title>

  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- GSAP + ScrollTrigger -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

  <!-- Tailwind Config -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              primary: '#0D9488',
              primaryDark: '#0F766E',
              accent: '#0D9488',
              accentLight: '#14B8A6',
              navy: '#0F172A',
              slate: {
                50: '#F8FAFC',
                100: '#F1F5F9',
                200: '#E2E8F0',
                300: '#CBD5E1',
                400: '#94A3B8',
                500: '#64748B',
                600: '#475569',
                700: '#334155',
                800: '#1E293B',
                900: '#0F172A'
              }
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
            display: ['Inter', 'system-ui', '-apple-system', 'sans-serif']
          },
          fontSize: {
            'display': ['clamp(2.375rem, 5.6vw, 4.25rem)', { lineHeight: '1.04', letterSpacing: '-0.035em' }],
            'h1': ['clamp(2.5rem, 5vw, 4rem)', { lineHeight: '1.1', letterSpacing: '-0.03em' }],
            'h2': ['clamp(2rem, 4vw, 3rem)', { lineHeight: '1.2', letterSpacing: '-0.02em' }],
            'h3': ['clamp(1.25rem, 2vw, 1.5rem)', { lineHeight: '1.3' }],
            'body': ['clamp(1rem, 1.5vw, 1.125rem)', { lineHeight: '1.7' }],
            'large': ['clamp(1.125rem, 2vw, 1.25rem)', { lineHeight: '1.6' }]
          },
          spacing: {
            'section': 'clamp(5rem, 9vw, 9rem)',
            'subsection': 'clamp(3rem, 6vw, 6rem)'
          },
          borderRadius: {
            '4xl': '2rem',
            '5xl': '2.5rem'
          },
          boxShadow: {
            'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
            'medium': '0 8px 40px -4px rgba(0, 0, 0, 0.08)',
            'large': '0 24px 80px -16px rgba(0, 0, 0, 0.12)',
            'glow': '0 0 60px rgba(13, 148, 136, 0.2)',
            'glow-coral': '0 0 60px rgba(255, 107, 107, 0.15)'
          }
        }
      }
    }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-feature-settings: "cv11", "ss01";
      font-optical-sizing: auto;
      overflow-x: clip;
    }

    h2, h3 {
      text-wrap: balance;
    }

    p {
      text-wrap: pretty;
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* Word masks for headline reveals (text stays visible without JS) */
    .wm {
      display: inline-block;
      overflow: hidden;
      vertical-align: top;
      padding-bottom: 0.14em;
      margin-bottom: -0.14em;
    }

    .wm > span {
      display: inline-block;
    }

    /* Card hover effects */
    .lift-card {
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                  box-shadow 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .lift-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 24px 60px -12px rgba(0, 0, 0, 0.15);
    }

    /* Accessibility Focus States */
    a:focus-visible, button:focus-visible, .lift-card:focus-visible {
      outline: none;
      box-shadow: 0 0 0 2px #ffffff, 0 0 0 4px #0D9488;
      border-radius: inherit;
    }

    .cursor-click {
      cursor: pointer;
    }

    /* Button styles */
    .btn-primary {
      position: relative;
      overflow: hidden;
      isolation: isolate;
      transition: box-shadow 0.3s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.3s;
    }

    .btn-primary::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: -1;
      background: linear-gradient(110deg, transparent 30%, rgba(255, 255, 255, 0.28) 50%, transparent 70%);
      transform: translateX(-120%);
      transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn-primary:hover::before {
      transform: translateX(120%);
    }

    .btn-primary:hover {
      box-shadow: 0 12px 40px rgba(13, 148, 136, 0.35);
    }

    .btn-secondary {
      transition: background-color 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      backdrop-filter: blur(10px);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.1);
    }

    /* Nav link underline */
    .nav-link {
      position: relative;
    }

    .nav-link::after {
      content: '';
      position: absolute;
      left: 0.75rem;
      right: 0.75rem;
      bottom: 0.3rem;
      height: 2px;
      border-radius: 2px;
      background: #0D9488;
      transform: scaleX(0);
      transform-origin: right;
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .nav-link:hover::after {
      transform: scaleX(1);
      transform-origin: left;
    }

    /* Glass morphism */
    .glass {
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.5);
    }

    .glass-dark {
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Solid background colors */
    .bg-hero {
      background-color: #FFFFFF;
    }

    .bg-section {
      background-color: #F8FAFC;
    }

    .bg-navy {
      background-color: #0F172A;
    }

    /* Accordion */
    .accordion-content {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.45s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .accordion-content > div {
      overflow: hidden;
    }

    .accordion-content.open {
      grid-template-rows: 1fr;
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 10px;
    }

    ::-webkit-scrollbar-track {
      background: #F1F5F9;
    }

    ::-webkit-scrollbar-thumb {
      background: #0D9488;
      border-radius: 5px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #0F766E;
    }

    /* Floating animation */
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    .float {
      animation: float 6s ease-in-out infinite;
    }

    .float-delayed {
      animation: float 6s ease-in-out infinite;
      animation-delay: 3s;
    }

    .text-brand-primary {
      color: #0D9488;
    }

    /* Accreditation marquee */
    .marquee {
      contain: inline-size;
      overflow: hidden;
      -webkit-mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
      mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
    }

    .marquee-track {
      display: flex;
      width: max-content;
      animation: marquee 38s linear infinite;
    }

    .marquee:hover .marquee-track {
      animation-play-state: paused;
    }

    @keyframes marquee {
      to { transform: translateX(-50%); }
    }

    @media (prefers-reduced-motion: reduce) {
      .marquee-track {
        animation: none;
        flex-wrap: wrap;
        width: auto;
        justify-content: center;
      }
      .marquee-track > [aria-hidden="true"] {
        display: none;
      }
      .marquee {
        -webkit-mask-image: none;
        mask-image: none;
      }
    }

    /* Mobile menu entrance */
    @keyframes menuIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: none; }
    }

    .menu-in {
      animation: menuIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Scroll progress */
    .scroll-progress {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: #0D9488;
      transform: scaleX(0);
      transform-origin: left;
      z-index: 60;
      pointer-events: none;
    }

    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body class="font-sans antialiased text-brand-slate-600">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useLayoutEffect } = React;

    // Icon Component
    const Icon = ({ name, size = 24, className = "" }) => {
      useEffect(() => {
        lucide.createIcons();
      }, [name]);
      return <i data-lucide={name} width={size} height={size} className={className}></i>;
    };

    // Splits a phrase into masked words so headings can rise into place
    const Words = ({ text, className = "" }) => (
      <>
        {text.split(' ').map((word, i, all) => (
          <React.Fragment key={i}>
            <span className="wm"><span data-word className={className}>{word}</span></span>
            {i < all.length - 1 ? ' ' : ''}
          </React.Fragment>
        ))}
      </>
    );

    // Navigation Component
    const Navigation = () => {
      const [scrolled, setScrolled] = useState(false);
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

      useEffect(() => {
        const handleScroll = () => setScrolled(window.scrollY > 100);
        window.addEventListener('scroll', handleScroll, { passive: true });
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      const navLinks = [
        { href: '#services', label: 'Services' },
        { href: '#clinic', label: 'Clinic' },
        { href: '#doctor', label: 'Dr. Akhil' },
        { href: '#about', label: 'About' },
        { href: '#process', label: 'Process' },
        { href: '#testimonials', label: 'Stories' },
        { href: '#faq', label: 'FAQ' }
      ];

      return (
        <nav data-nav className={`fixed top-4 left-4 right-4 rounded-2xl z-50 transition-[background-color,box-shadow] duration-500 ${scrolled ? 'bg-white/95 backdrop-blur-md shadow-medium' : 'bg-white shadow-soft'}`}>
          <div className="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8">
            <div className="flex items-center justify-between h-20 gap-3">
              <a href="#" className="flex items-center gap-2.5 sm:gap-3 group">
                <div className="w-10 h-10 sm:w-11 sm:h-11 bg-brand-primary rounded-xl flex items-center justify-center shadow-lg group-hover:shadow-glow transition-shadow duration-300">
                  <span className="inline-flex transition-transform duration-700 ease-out group-hover:rotate-90">
                    <Icon name="sun" size={22} className="text-white" />
                  </span>
                </div>
                <div className="whitespace-nowrap">
                  <span className="text-lg sm:text-xl font-bold text-brand-slate-900 block -mb-1">Dawn Dental</span>
                  <span className="text-xs text-brand-slate-500 font-medium">CLINIC</span>
                </div>
              </a>

              <div className="hidden lg:flex items-center">
                {navLinks.map((link) => (
                  <a
                    key={link.href}
                    href={link.href}
                    className="nav-link px-3 xl:px-4 py-2 text-sm font-medium text-brand-slate-600 hover:text-brand-primary rounded-lg transition-colors duration-200"
                  >
                    {link.label}
                  </a>
                ))}
              </div>

              <div className="flex items-center gap-2 sm:gap-3">
                <a href="tel:+15551234567" className="hidden md:flex lg:hidden xl:flex items-center gap-2 text-sm font-medium text-brand-slate-600 hover:text-brand-primary transition-colors whitespace-nowrap">
                  <div className="w-8 h-8 bg-brand-primary/10 rounded-full flex items-center justify-center">
                    <Icon name="phone" size={16} />
                  </div>
                  (555) 123-4567
                </a>
                <a href="#contact" data-magnetic className="btn-primary hidden min-[375px]:inline-flex items-center px-4 sm:px-5 py-2.5 bg-brand-primary text-white text-sm sm:text-base font-semibold rounded-xl shadow-md whitespace-nowrap">
                  Book Now
                </a>
                <button
                  onClick={() => setMobileMenuOpen(!mobileMenuOpen)}
                  className="lg:hidden w-11 h-11 flex items-center justify-center rounded-lg hover:bg-brand-slate-100 transition-colors"
                  aria-label={mobileMenuOpen ? 'Close menu' : 'Open menu'}
                  aria-expanded={mobileMenuOpen}
                >
                  <Icon name={mobileMenuOpen ? "x" : "menu"} size={24} />
                </button>
              </div>
            </div>
          </div>

          {/* Mobile Menu */}
          {mobileMenuOpen && (
            <div className="menu-in lg:hidden border-t border-brand-slate-200 rounded-b-2xl bg-white">
              <div className="px-4 py-5 space-y-1">
                {navLinks.map((link) => (
                  <a
                    key={link.href}
                    href={link.href}
                    onClick={() => setMobileMenuOpen(false)}
                    className="block px-4 py-3 text-base font-medium text-brand-slate-600 hover:text-brand-primary hover:bg-brand-slate-100/50 rounded-xl transition-colors"
                  >
                    {link.label}
                  </a>
                ))}
                <a href="#contact" onClick={() => setMobileMenuOpen(false)} className="block w-full text-center mt-3 px-5 py-3 bg-brand-primary text-white font-semibold rounded-xl">
                  Book Appointment
                </a>
              </div>
            </div>
          )}
        </nav>
      );
    };

    // Hero Section
    const Hero = () => {
      return (
        <section data-hero className="relative pt-32 pb-16 sm:pt-36 lg:pt-40 lg:pb-24 bg-hero overflow-hidden">
          {/* Decorative elements */}
          <div data-drift className="absolute top-1/4 left-10 w-72 h-72 bg-brand-primary/5 rounded-full blur-3xl"></div>
          <div data-drift className="absolute bottom-1/4 right-10 w-96 h-96 bg-brand-accent/5 rounded-full blur-3xl"></div>

          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
            <div className="grid lg:grid-cols-12 gap-14 lg:gap-12 items-center">
              <div className="lg:col-span-7">
                <div data-hero-item className="inline-flex items-center gap-2 px-4 py-2.5 bg-white rounded-full shadow-soft mb-7 border border-brand-slate-200">
                  <span className="relative flex h-2.5 w-2.5">
                    <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-brand-accent opacity-75"></span>
                    <span className="relative inline-flex rounded-full h-2.5 w-2.5 bg-brand-accent"></span>
                  </span>
                  <span className="text-sm font-semibold text-brand-slate-700">Accepting New Patients</span>
                </div>

                <h1 data-hero-title className="text-display font-bold text-brand-slate-900 mb-6">
                  <Words text="Where Advanced" />
                  <span className="text-brand-primary block"><Words text="Dentistry Meets" /></span>
                  <Words text="Compassionate Care" />
                </h1>

                <p data-hero-item className="text-large text-brand-slate-600 mb-9 max-w-xl leading-relaxed">
                  Experience dental care reimagined. Our board-certified specialists combine
                  cutting-edge technology with personalized treatment plans for outcomes
                  that transform smiles and lives.
                </p>

                <div data-hero-item className="flex flex-col sm:flex-row gap-4 mb-12">
                  <a href="#contact" data-magnetic className="btn-primary inline-flex items-center justify-center px-8 py-4 bg-brand-primary text-white font-semibold rounded-xl shadow-lg group">
                    Schedule Consultation
                    <span className="inline-flex ml-2 transition-transform duration-300 group-hover:translate-x-1">
                      <Icon name="arrow-right" size={20} />
                    </span>
                  </a>
                  <a href="#services" className="btn-secondary inline-flex items-center justify-center px-8 py-4 bg-white/80 text-brand-slate-700 font-semibold rounded-xl border border-brand-slate-200">
                    Explore Services
                  </a>
                </div>

                {/* Stats */}
                <div className="grid grid-cols-3 gap-4 sm:flex sm:gap-x-12">
                  {[
                    { end: 15, suffix: '+', label: 'Years Excellence' },
                    { end: 8, suffix: 'K+', label: 'Happy Patients' },
                    { end: 98, suffix: '%', label: 'Satisfaction' }
                  ].map((stat) => (
                    <div key={stat.label} data-hero-stat>
                      <div className="text-3xl sm:text-4xl font-bold text-brand-slate-900 mb-1 tabular-nums" data-count={stat.end} data-suffix={stat.suffix}>
                        {stat.end}{stat.suffix}
                      </div>
                      <div className="text-sm font-medium text-brand-slate-500">{stat.label}</div>
                    </div>
                  ))}
                </div>
              </div>

              {/* Hero Image */}
              <div className="relative lg:col-span-5">
                <div data-hero-visual className="relative">
                  {/* Background decoration */}
                  <div className="absolute -inset-4 bg-brand-primary/20 rounded-5xl blur-2xl opacity-60"></div>

                  {/* Main image card */}
                  <div data-hero-frame className="relative bg-white rounded-4xl shadow-large overflow-hidden border border-brand-slate-200 aspect-[4/3] lg:aspect-[9/8]">
                    <img
                      data-hero-img
                      src="assets/clinic-treatment-room-hd.jpg"
                      alt="Treatment room at Dawn Dental Clinic with a modern dental chair"
                      className="absolute inset-0 w-full h-full object-cover"
                      style={{ objectPosition: '45% 60%' }}
                      loading="eager"
                    />

                    {/* Floating info card */}
                    <div data-hero-card className="hidden sm:block absolute bottom-5 left-5 right-5 lg:right-auto glass rounded-2xl p-4 lg:p-5 shadow-lg">
                      <div className="flex items-center gap-4">
                        <div className="flex -space-x-2.5">
                          {[1, 2, 3, 4, 5].map(i => (
                            <div
                              key={i}
                              className="w-9 h-9 rounded-full bg-brand-primary border-2 border-white flex items-center justify-center text-white text-xs font-bold"
                            >
                              {String.fromCharCode(64 + i)}
                            </div>
                          ))}
                        </div>
                        <div>
                          <div className="font-semibold text-brand-slate-900">8,000+ Patients</div>
                          <div className="text-xs text-brand-slate-600 flex items-center gap-1">
                            <div className="flex">
                              {[1,2,3,4,5].map(i => (
                                <Icon key={i} name="star" size={10} className="text-yellow-500 fill-yellow-500" />
                              ))}
                            </div>
                            5-star rated care
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>

                  {/* Floating badge */}
                  <div data-hero-badge className="absolute -top-5 -right-2 sm:-top-6 sm:-right-6">
                    <div className="float bg-white rounded-2xl shadow-large p-3.5 sm:p-5 border border-brand-slate-200">
                      <div className="flex items-center gap-3">
                        <div className="w-10 h-10 sm:w-12 sm:h-12 bg-brand-primary/10 rounded-xl flex items-center justify-center">
                          <Icon name="award" size={24} className="text-brand-primary" />
                        </div>
                        <div>
                          <div className="text-xl sm:text-2xl font-bold text-brand-slate-900">15+</div>
                          <div className="text-xs text-brand-slate-500 font-medium">Years Experience</div>
                        </div>
                      </div>
                    </div>
                  </div>

                  {/* Second floating badge */}
                  <div data-hero-badge className="absolute -bottom-6 -left-2 sm:-left-5 lg:bottom-auto lg:top-1/3 lg:-left-10">
                    <div className="float-delayed bg-white rounded-2xl shadow-large p-3.5 sm:p-5 border border-brand-slate-200">
                      <div className="flex items-center gap-3">
                        <div className="w-10 h-10 sm:w-12 sm:h-12 bg-brand-accent/10 rounded-xl flex items-center justify-center">
                          <Icon name="heart" size={24} className="text-brand-accent" />
                        </div>
                        <div>
                          <div className="text-xl sm:text-2xl font-bold text-brand-slate-900">98%</div>
                          <div className="text-xs text-brand-slate-500 font-medium">Success Rate</div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>
      );
    };

    // Authority Bar
    const AuthorityBar = () => {
      const partners = [
        { name: "American Dental Association", icon: "shield" },
        { name: "Board Certified", icon: "award" },
        { name: "Invisalign Elite", icon: "smile" },
        { name: "3M Excellence", icon: "star" },
        { name: "Straumann Partner", icon: "activity" },
        { name: "CareCredit", icon: "credit-card" }
      ];

      const group = (hidden) => (
        <div className="flex items-center gap-10 md:gap-16 pr-10 md:pr-16" aria-hidden={hidden ? 'true' : undefined}>
          {partners.map((partner) => (
            <div key={partner.name} className="group flex items-center gap-3 whitespace-nowrap">
              <div className="w-12 h-12 bg-brand-slate-100 rounded-xl flex items-center justify-center group-hover:bg-brand-primary transition-colors duration-300">
                <span className="inline-flex text-brand-slate-400 group-hover:text-white transition-colors duration-300">
                  <Icon name={partner.icon} size={22} />
                </span>
              </div>
              <span className="text-sm font-semibold text-brand-slate-600">{partner.name}</span>
            </div>
          ))}
        </div>
      );

      return (
        <section data-authority className="py-12 border-y border-brand-slate-200 bg-brand-slate-50">
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <p className="text-center text-sm font-semibold text-brand-slate-500 tracking-wider mb-8">
              ACCREDITED & TRUSTED BY LEADING ORGANIZATIONS
            </p>
            <div className="marquee">
              <div className="marquee-track">
                {group(false)}
                {group(true)}
              </div>
            </div>
          </div>
        </section>
      );
    };

    // ---------- Motion ----------
    // Content renders fully visible; GSAP only animates *from* an offset state,
    // so the page still reads correctly if a script fails or motion is reduced.
    const EASE = 'expo.out';

    const formatCount = (value, el) => {
      const decimals = Number(el.dataset.decimals || 0);
      return value.toLocaleString(undefined, { minimumFractionDigits: decimals, maximumFractionDigits: decimals }) + (el.dataset.suffix || '');
    };

    const countUp = (el, delay = 0) => {
      const end = Number(el.dataset.count);
      const state = { v: 0 };
      el.textContent = formatCount(0, el);
      return gsap.to(state, {
        v: end, duration: 2, delay, ease: 'power3.out',
        onUpdate: () => { el.textContent = formatCount(state.v, el); },
        onComplete: () => { el.textContent = formatCount(end, el); }
      });
    };

    const revealOnScroll = (trigger, build, start = 'top 82%') => {
      const tl = gsap.timeline({ paused: true });
      build(tl);
      ScrollTrigger.create({ trigger, start, once: true, onEnter: () => tl.play() });
    };

    const setupMotion = () => {
      gsap.registerPlugin(ScrollTrigger);
      const q = (sel, root = document) => Array.from(root.querySelectorAll(sel));

      // Scroll progress runs regardless of motion preference (it is feedback, not decoration)
      gsap.to('.scroll-progress', { scaleX: 1, ease: 'none', scrollTrigger: { start: 0, end: 'max', scrub: 0.3 } });

      const mm = gsap.matchMedia();
      mm.add('(prefers-reduced-motion: no-preference)', () => {
        // --- Hero: orchestrated first load ---
        const hero = gsap.timeline({ defaults: { ease: EASE } });
        hero
          .from('[data-nav]', { y: -40, autoAlpha: 0, duration: 1 })
          .from('[data-hero-title] [data-word]', { yPercent: 115, rotate: 4, duration: 1.2, stagger: 0.07 }, 0.15)
          .from('[data-hero-item]', { y: 28, autoAlpha: 0, duration: 1, stagger: 0.1 }, 0.35)
          .from('[data-hero-stat]', { y: 24, autoAlpha: 0, duration: 0.9, stagger: 0.1 }, 0.7)
          .fromTo('[data-hero-frame]', { clipPath: 'inset(18% 12% 18% 12% round 2rem)' }, { clipPath: 'inset(0% 0% 0% 0% round 2rem)', duration: 1.6, clearProps: 'clipPath' }, 0.2)
          .from('[data-hero-img]', { scale: 1.35, duration: 2, ease: 'power3.out' }, 0.2)
          .from('[data-hero-card]', { y: 30, autoAlpha: 0, duration: 1 }, 1.0)
          .from('[data-hero-badge]', { scale: 0.6, autoAlpha: 0, duration: 1, stagger: 0.15 }, 1.1);
        q('[data-hero-stat] [data-count]').forEach((el, i) => hero.add(countUp(el), 0.8 + i * 0.1));

        // Hero depth while scrolling away
        gsap.to('[data-hero-img]', { yPercent: 8, ease: 'none', scrollTrigger: { trigger: '[data-hero]', start: 'top top', end: 'bottom top', scrub: true } });
        gsap.to('[data-hero-badge]', { y: (i) => (i ? -60 : -110), ease: 'none', scrollTrigger: { trigger: '[data-hero]', start: 'top top', end: 'bottom top', scrub: true } });

        // Ambient blobs drift slowly
        q('[data-drift]').forEach((el, i) => {
          gsap.to(el, { x: i % 2 ? -40 : 40, y: i % 2 ? 30 : -30, scale: 1.15, duration: 9 + i, ease: 'sine.inOut', yoyo: true, repeat: -1 });
        });

        // Accreditation strip
        revealOnScroll('[data-authority]', (tl) => tl.from('[data-authority]', { autoAlpha: 0, y: 20, duration: 1, ease: EASE }), 'top 92%');

        // --- Section headings: words rise, pill and paragraph follow ---
        q('[data-head]').forEach((head) => {
          revealOnScroll(head, (tl) => tl
            .from(q('[data-word]', head), { yPercent: 115, duration: 1.1, stagger: 0.05, ease: EASE }, 0.1)
            .from(q('[data-head-item]', head), { y: 24, autoAlpha: 0, duration: 0.9, stagger: 0.15, ease: EASE }, 0));
        });

        // --- Solutions: cards unfold, photos wipe up, icons pop ---
        gsap.set('[data-card]', { autoAlpha: 0, y: 80, rotateX: -12, transformOrigin: '50% 0%' });
        ScrollTrigger.batch('[data-card]', {
          start: 'top 88%',
          once: true,
          onEnter: (cards) => {
            gsap.to(cards, { autoAlpha: 1, y: 0, rotateX: 0, duration: 1.2, stagger: 0.12, ease: EASE, clearProps: 'transform' });
            cards.forEach((card, i) => {
              const d = i * 0.12;
              gsap.fromTo(card.querySelector('[data-card-media]'), { clipPath: 'inset(100% 0% 0% 0%)' }, { clipPath: 'inset(0% 0% 0% 0%)', duration: 1.3, delay: d + 0.1, ease: 'power4.out', clearProps: 'clipPath' });
              gsap.from(card.querySelector('[data-card-img]'), { scale: 1.4, duration: 1.8, delay: d + 0.1, ease: 'power3.out', clearProps: 'transform' });
              gsap.from(card.querySelector('[data-card-icon]'), { scale: 0, rotate: -45, duration: 0.9, delay: d + 0.55, ease: 'back.out(1.6)', clearProps: 'transform' });
            });
          }
        });

        // --- Clinic photos: curtain reveal + inner parallax ---
        q('[data-photo]').forEach((fig) => {
          const from = fig.dataset.photo === 'side' ? 'inset(0% 0% 0% 100%)' : 'inset(100% 0% 0% 0%)';
          revealOnScroll(fig, (tl) => tl
            .fromTo(fig, { clipPath: from }, { clipPath: 'inset(0% 0% 0% 0%)', duration: 1.5, ease: 'power4.inOut', clearProps: 'clipPath' })
            .from(fig.querySelector('[data-photo-img]'), { scale: 1.3, duration: 1.8, ease: 'power3.out' }, 0)
            .from(fig.querySelector('[data-caption]'), { y: 30, autoAlpha: 0, duration: 0.9, ease: EASE }, 0.9));
          gsap.fromTo(fig.querySelector('[data-photo-img]'), { yPercent: -6 }, { yPercent: 6, ease: 'none', scrollTrigger: { trigger: fig, start: 'top bottom', end: 'bottom top', scrub: true } });
        });
        revealOnScroll('[data-list]', (tl) => tl.from('[data-list-item]', { y: 30, autoAlpha: 0, duration: 0.9, stagger: 0.1, ease: EASE }));

        // --- Doctor ---
        gsap.to('[data-ring]', { rotate: 360, duration: 40, ease: 'none', repeat: -1 });
        revealOnScroll('[data-portrait]', (tl) => tl
          .fromTo('[data-portrait-frame]', { clipPath: 'circle(0% at 50% 50%)' }, { clipPath: 'circle(75% at 50% 50%)', duration: 1.6, ease: 'power4.inOut', clearProps: 'clipPath' })
          .from('[data-portrait-img]', { scale: 1.3, duration: 2, ease: 'power3.out' }, 0)
          .from('[data-ring]', { scale: 0.7, autoAlpha: 0, duration: 1.4, ease: EASE }, 0.2)
          .from('[data-portrait-badge]', { scale: 0.6, autoAlpha: 0, duration: 0.9, stagger: 0.15, ease: EASE }, 0.9));
        revealOnScroll('[data-bio]', (tl) => tl
          .from('[data-bio] [data-word]', { yPercent: 115, duration: 1.1, stagger: 0.08, ease: EASE }, 0.1)
          .from('[data-bio-item]', { x: 40, autoAlpha: 0, duration: 0.9, stagger: 0.08, ease: EASE }, 0)
          .from('[data-check]', { scale: 0, duration: 0.6, stagger: 0.1, ease: 'back.out(2)' }, 0.6));

        // --- About (navy) ---
        revealOnScroll('[data-about]', (tl) => tl
          .from('[data-about] [data-word]', { yPercent: 115, duration: 1.1, stagger: 0.06, ease: EASE }, 0.1)
          .from('[data-about-item]', { y: 24, autoAlpha: 0, duration: 0.9, stagger: 0.12, ease: EASE }, 0)
          .from('[data-feature]', { x: -40, autoAlpha: 0, duration: 0.9, stagger: 0.12, ease: EASE }, 0.4));
        revealOnScroll('[data-stats]', (tl) => {
          tl.from('[data-stats]', { y: 60, scale: 0.94, autoAlpha: 0, duration: 1.3, ease: EASE })
            .from('[data-stat-tile]', { y: 24, autoAlpha: 0, duration: 0.8, stagger: 0.08, ease: EASE }, 0.4);
          q('[data-stats] [data-count]').forEach((el, i) => tl.add(countUp(el), 0.3 + i * 0.08));
        });

        // --- Process: the line draws with scroll, steps pop in sequence ---
        gsap.fromTo('[data-line]', { scaleX: 0 }, { scaleX: 1, ease: 'none', scrollTrigger: { trigger: '[data-steps]', start: 'top 75%', end: 'bottom 60%', scrub: 0.6 } });
        revealOnScroll('[data-steps]', (tl) => tl
          .from('[data-step-icon]', { scale: 0, rotate: -30, duration: 1, stagger: 0.18, ease: 'back.out(1.7)', clearProps: 'transform' })
          .from('[data-step] .text-center', { y: 30, autoAlpha: 0, duration: 0.9, stagger: 0.18, ease: EASE }, 0.15));

        // --- Testimonials: cards fan in, stars light up ---
        revealOnScroll('#testimonials .grid', (tl) => tl
          .from('[data-quote]', { y: 80, rotate: (i) => [-4, 0, 4][i % 3], autoAlpha: 0, duration: 1.2, stagger: 0.14, ease: EASE, clearProps: 'transform' })
          .from('[data-star]', { scale: 0, rotate: -90, duration: 0.5, stagger: 0.03, ease: 'back.out(2)' }, 0.4));

        // --- FAQ ---
        revealOnScroll('#faq .space-y-4', (tl) => tl.from('[data-faq]', { y: 24, autoAlpha: 0, duration: 0.8, stagger: 0.06, ease: EASE }), 'top 85%');

        // --- CTA ---
        revealOnScroll('[data-cta]', (tl) => tl
          .from('[data-cta]', { y: 60, scale: 0.92, autoAlpha: 0, duration: 1.3, ease: EASE })
          .from('[data-cta] [data-word]', { yPercent: 115, duration: 1.1, stagger: 0.05, ease: EASE }, 0.3)
          .from('[data-cta-item]', { y: 24, autoAlpha: 0, duration: 0.9, stagger: 0.1, ease: EASE }, 0.3));
        q('[data-cta-orb]').forEach((el, i) => gsap.to(el, { x: i ? 50 : -50, y: i ? -30 : 40, duration: 7 + i * 2, ease: 'sine.inOut', yoyo: true, repeat: -1 }));

        // --- Footer ---
        revealOnScroll('[data-footer]', (tl) => tl.from('[data-footer-col]', { y: 30, autoAlpha: 0, duration: 0.9, stagger: 0.1, ease: EASE }), 'top 92%');

        // --- Pointer-only polish: tilting cards, magnetic buttons ---
        const cleanups = [];
        if (window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
          q('[data-tilt]').forEach((card) => {
            gsap.set(card, { transformPerspective: 900 });
            const rx = gsap.quickTo(card, 'rotationX', { duration: 0.6, ease: 'power3.out' });
            const ry = gsap.quickTo(card, 'rotationY', { duration: 0.6, ease: 'power3.out' });
            const ty = gsap.quickTo(card, 'y', { duration: 0.6, ease: 'power3.out' });
            const move = (e) => {
              const r = card.getBoundingClientRect();
              ry(((e.clientX - r.left) / r.width - 0.5) * 8);
              rx(((e.clientY - r.top) / r.height - 0.5) * -8);
              ty(-8);
            };
            const leave = () => { rx(0); ry(0); ty(0); };
            card.addEventListener('pointermove', move);
            card.addEventListener('pointerleave', leave);
            cleanups.push(() => { card.removeEventListener('pointermove', move); card.removeEventListener('pointerleave', leave); });
          });
          q('[data-magnetic]').forEach((btn) => {
            const mx = gsap.quickTo(btn, 'x', { duration: 0.5, ease: 'power3.out' });
            const my = gsap.quickTo(btn, 'y', { duration: 0.5, ease: 'power3.out' });
            const move = (e) => {
              const r = btn.getBoundingClientRect();
              mx((e.clientX - r.left - r.width / 2) * 0.25);
              my((e.clientY - r.top - r.height / 2) * 0.35);
            };
            const leave = () => { mx(0); my(0); };
            btn.addEventListener('pointermove', move);
            btn.addEventListener('pointerleave', leave);
            cleanups.push(() => { btn.removeEventListener('pointermove', move); btn.removeEventListener('pointerleave', leave); });
          });
        }
        return () => cleanups.forEach((fn) => fn());
      });

      // Images and fonts change layout after first paint; re-measure triggers once they settle
      const refresh = () => ScrollTrigger.refresh();
      window.addEventListener('load', refresh);
      document.fonts && document.fonts.ready.then(refresh);

      return () => {
        window.removeEventListener('load', refresh);
        mm.revert();
        ScrollTrigger.getAll().forEach((t) => t.kill());
      };
    };

    // Main App Component
    const App = () => {
      useLayoutEffect(() => {
        lucide.createIcons();
        if (!window.gsap || !window.ScrollTrigger) return;
        return setupMotion();
      }, []);

      return (
        <div className="min-h-screen bg-white">
          <div className="scroll-progress" aria-hidden="true"></div>
          <Navigation />
          <main>
            <Hero />
            <AuthorityBar />
            <Services />
            <Clinic />
            <Doctor />
            <About />
            <Process />
            <Testimonials />
            <FAQ />
            <CTA />
          </main>
          <Footer />
        </div>
      );
    };

    // Render the app
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
